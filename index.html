<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>❤</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{--void:#060203;--wine:#170208;--crimson:#c4213f;--rose:#f4cfcf;--gold:#d8a56b;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,var(--wine) 0%,var(--void) 72%);
    font-family:'Montserrat',sans-serif;color:var(--rose);-webkit-user-select:none;user-select:none;}
  canvas#bg{position:fixed;inset:0;z-index:0;}
  .flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,120,110,.85),transparent 60%);
    z-index:6;opacity:0;pointer-events:none;}

  #stage-heart{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .6s ease;}
  #stage-heart.hidden{opacity:0;pointer-events:none;}
  #heartCanvas{width:min(82vw,340px);height:min(82vw,340px);cursor:pointer;}
  .tap-label{margin-top:18px;font-family:'Playfair Display',serif;font-style:italic;font-size:1.05rem;
    letter-spacing:.5px;color:var(--gold);animation:pulseText 2.2s ease-in-out infinite;}
  @keyframes pulseText{0%,100%{opacity:.5;}50%{opacity:1;}}

  #stage-reveal{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;
    padding:7vh 6vw 5vh;opacity:0;pointer-events:none;transition:opacity .5s ease;}
  #stage-reveal.active{opacity:1;pointer-events:auto;}

  #thumbRow{display:flex;gap:12px;justify-content:center;min-height:100px;margin-bottom:auto;}
  .photo-slot{width:76px;height:96px;border-radius:10px;overflow:hidden;position:relative;
    border:1.5px dashed rgba(216,165,107,.5);background:rgba(255,255,255,.03);}
  .photo-slot.filled{border-style:solid;border-color:rgba(216,165,107,.6);box-shadow:0 6px 18px rgba(0,0,0,.5);}
  .ph-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;
    color:var(--gold);opacity:.55;gap:4px;}

  #bigStage{position:fixed;inset:0;z-index:7;pointer-events:none;}
  .big-card{position:fixed;border-radius:16px;overflow:hidden;
    box-shadow:0 25px 70px rgba(0,0,0,.65),0 0 45px rgba(196,33,63,.4);
    background:rgba(255,255,255,.04);border:1px solid rgba(216,165,107,.4);
    opacity:0;transition:opacity .5s ease,left .65s cubic-bezier(.4,0,.2,1),top .65s cubic-bezier(.4,0,.2,1),
    width .65s cubic-bezier(.4,0,.2,1),height .65s cubic-bezier(.4,0,.2,1);}
  .big-card.show{opacity:1;}

  #questionBox{margin-top:auto;opacity:0;transform:translateY(24px);
    transition:opacity .7s ease,transform .7s ease;}
  #questionBox.show{opacity:1;transform:translateY(0);}
  .frame-box{position:relative;border:1px solid rgba(216,165,107,.5);border-radius:18px;
    padding:34px 28px;background:rgba(20,4,8,.55);backdrop-filter:blur(6px);
    box-shadow:0 0 60px rgba(196,33,63,.25);text-align:center;}
  .frame-box::before,.frame-box::after{content:'';position:absolute;width:20px;height:20px;border:1px solid var(--gold);}
  .frame-box::before{top:-1px;left:-1px;border-right:none;border-bottom:none;}
  .frame-box::after{bottom:-1px;right:-1px;border-left:none;border-top:none;}
  #questionBox h1{font-family:'Playfair Display',serif;font-weight:600;font-size:1.5rem;margin:0 0 26px;
    color:#fff;text-shadow:0 0 30px rgba(196,33,63,.6);max-width:270px;}
  .btn-row{display:flex;gap:16px;justify-content:center;min-height:52px;}
  .btn{padding:14px 32px;border-radius:40px;font-weight:600;font-size:.98rem;letter-spacing:.4px;
    border:none;cursor:pointer;transition:opacity .35s ease,transform .35s ease;}
  #btnYes{background:linear-gradient(135deg,var(--crimson),#7a0f22);color:#fff;box-shadow:0 8px 24px rgba(196,33,63,.5);}
  #btnYes:active{transform:scale(.94);}
  #btnNo{background:transparent;color:var(--rose);border:1px solid rgba(244,207,207,.4);}
  #btnNo.gone{opacity:0;transform:scale(.6);pointer-events:none;}

  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-10px);}
    40%{transform:translateX(9px);}60%{transform:translateX(-6px);}80%{transform:translateX(5px);}}
  body.shake{animation:shake .4s ease;}

  #stage-final{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;opacity:0;pointer-events:none;transition:opacity .6s ease;}
  #stage-final.active{opacity:1;pointer-events:auto;}
  #stage-final h1{font-family:'Playfair Display',serif;font-size:1.9rem;color:#fff;text-shadow:0 0 30px rgba(196,33,63,.7);margin-bottom:8px;}
  #stage-final p{opacity:.75;font-size:.92rem;}
  .confetti-heart{position:absolute;top:-8%;font-size:1.4rem;color:var(--crimson);animation:fall linear forwards;pointer-events:none;z-index:9;}
  @keyframes fall{to{transform:translateY(115vh) rotate(360deg);opacity:0;}}
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="flash" id="flash"></div>
<div id="bigStage"></div>

<div id="stage-heart">
  <canvas id="heartCanvas" width="340" height="340"></canvas>
  <div class="tap-label">Нажми сюда</div>
</div>

<div id="stage-reveal">
  <div id="thumbRow"></div>
  <div id="questionBox">
    <div class="frame-box">
      <h1>Я тебе нравлюсь?</h1>
      <div class="btn-row">
        <button class="btn" id="btnYes">Да</button>
        <button class="btn" id="btnNo">Нет</button>
      </div>
    </div>
  </div>
</div>

<div id="stage-final">
  <h1>Я так и знал(а) ❤</h1>
  <p>Спасибо, что ответила честно.</p>
</div>

<script>
/* ============ CONFIG ============ */
const PHOTOS = ["photos/1.jpg","photos/2.jpg","photos/3.jpg"]; // öz şəkillərinizi bura qoyun (adları eyni saxlayın)
const HOLD_MS = 1600;   // böyük halda qalma müddəti
const SHRINK_MS = 700;  // balacalaşma animasiyası müddəti (cəmi ~2.3s)
const TELEGRAM_TOKEN = "8684980330:AAGS_BcTgBsH0dXw0Jg1qI5uidqVQ7dVjFw";
const TELEGRAM_CHAT_ID = "8610330090";

function sendTelegram(text){
  fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({chat_id:TELEGRAM_CHAT_ID,text})
  }).catch(()=>{});
}

/* ============ AMBIENT EMBER BACKGROUND ============ */
const bg=document.getElementById('bg'),bctx=bg.getContext('2d');
function resizeBg(){bg.width=innerWidth;bg.height=innerHeight;}
resizeBg();addEventListener('resize',resizeBg);
const embers=Array.from({length:70},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,
  r:Math.random()*1.6+0.4,vy:Math.random()*0.35+0.12,drift:Math.random()*0.5-0.25,a:Math.random()*0.45+0.15}));
function drawBg(){
  bctx.clearRect(0,0,bg.width,bg.height);
  embers.forEach(p=>{
    bctx.beginPath();bctx.fillStyle=`rgba(220,80,80,${p.a})`;bctx.arc(p.x,p.y,p.r,0,Math.PI*2);bctx.fill();
    p.y-=p.vy;p.x+=p.drift;
    if(p.y<-10){p.y=innerHeight+10;p.x=Math.random()*innerWidth;}
  });
  requestAnimationFrame(drawBg);
}
drawBg();

/* ============ WIRE-PARTICLE HEART ============ */
const hc=document.getElementById('heartCanvas'),hctx=hc.getContext('2d');
const W=hc.width,H=hc.height,CX=W/2,CY=H/2+8,SCALE=9.6,TARGET_COUNT=90,TRACE_LEN=9;
function heartXY(t){
  const x=16*Math.pow(Math.sin(t),3);
  const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
  return{x:CX+x*SCALE,y:CY-y*SCALE};
}
const particles=Array.from({length:TARGET_COUNT},(_,i)=>{
  const t=(i/TARGET_COUNT)*Math.PI*2,target=heartXY(t),start={x:Math.random()*W,y:Math.random()*H};
  return{target,x:start.x,y:start.y,speed:Math.random()*0.05+0.045,phase:Math.random()*Math.PI*2,
    trace:Array.from({length:TRACE_LEN},()=>({x:start.x,y:start.y})),settled:false};
});
let heartAnimActive=true,clock=0;
function drawHeart(){
  hctx.clearRect(0,0,W,H);clock+=0.045;
  const beat=1+Math.sin(clock)*0.03;
  hctx.save();hctx.translate(CX,CY);hctx.scale(beat,beat);hctx.translate(-CX,-CY);hctx.lineCap='round';
  particles.forEach(p=>{
    const wobble=p.settled?Math.sin(clock*2+p.phase)*1.6:0;
    const tx=p.target.x+wobble,ty=p.target.y+wobble;
    p.x+=(tx-p.x)*p.speed;p.y+=(ty-p.y)*p.speed;
    if(Math.abs(tx-p.x)<0.6&&Math.abs(ty-p.y)<0.6)p.settled=true;
    p.trace.push({x:p.x,y:p.y});if(p.trace.length>TRACE_LEN)p.trace.shift();
    for(let i=1;i<p.trace.length;i++){
      const a=i/p.trace.length;
      hctx.beginPath();hctx.strokeStyle=`rgba(255,90,80,${a*0.5})`;hctx.lineWidth=a*1.6;
      hctx.moveTo(p.trace[i-1].x,p.trace[i-1].y);hctx.lineTo(p.trace[i].x,p.trace[i].y);hctx.stroke();
    }
    hctx.beginPath();hctx.shadowBlur=10;hctx.shadowColor='rgba(255,110,100,0.9)';
    hctx.fillStyle='rgba(255,190,180,0.9)';hctx.arc(p.x,p.y,1.5,0,Math.PI*2);hctx.fill();hctx.shadowBlur=0;
  });
  hctx.restore();
  if(heartAnimActive)requestAnimationFrame(drawHeart);
}
drawHeart();

/* ============ CRACK OVERLAY ============ */
function playCrack(){
  return new Promise(resolve=>{
    const overlay=document.createElement('div');
    overlay.style.cssText='position:fixed;inset:0;z-index:5;pointer-events:none;';
    const cv=document.createElement('canvas');cv.width=innerWidth;cv.height=innerHeight;cv.style.cssText='width:100%;height:100%;';
    overlay.appendChild(cv);document.body.appendChild(overlay);
    const cctx=cv.getContext('2d');
    const midX=innerWidth/2,midY=innerHeight/2;
    const zig=[];let y=midY-150;
    while(y<midY+150){zig.push({x:midX+(Math.random()*40-20),y});y+=14;}
    let progress=0;
    const flash=document.getElementById('flash');
    flash.style.transition='opacity .15s ease';flash.style.opacity=1;
    setTimeout(()=>{flash.style.opacity=0;},150);
    function anim(){
      progress+=0.06;
      cctx.clearRect(0,0,cv.width,cv.height);
      cctx.save();cctx.globalAlpha=Math.max(1-progress*0.8,0);
      const spread=progress*40;
      cctx.strokeStyle='rgba(255,140,120,0.95)';cctx.lineWidth=3;
      cctx.shadowBlur=20;cctx.shadowColor='rgba(255,90,80,0.9)';
      cctx.beginPath();
      zig.forEach((pt,i)=>{
        const dir=i%2===0?-1:1,px=pt.x+dir*spread;
        if(i===0)cctx.moveTo(px,pt.y);else cctx.lineTo(px,pt.y);
      });
      cctx.stroke();cctx.restore();
      if(progress<1)requestAnimationFrame(anim);
      else{overlay.remove();resolve();}
    }
    anim();
  });
}

/* ============ PLACEHOLDER-AWARE CONTENT LOADER ============ */
function fillWithPhoto(el, src, num, small){
  el.innerHTML='';
  const img=new Image();
  img.onload=()=>{
    const tag=document.createElement('img');
    tag.src=src;
    tag.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;';
    el.appendChild(tag);
  };
  img.onerror=()=>{
    const ph=document.createElement('div');
    ph.className='ph-placeholder';
    ph.innerHTML=`<div style="font-size:${small?'1.1rem':'2.4rem'}">❤</div>
      <div style="font-size:${small?'.6rem':'.85rem'};letter-spacing:.5px;">Фото ${num}</div>`;
    el.appendChild(ph);
  };
  img.src=src;
}

/* ============ STAGE FLOW ============ */
let heartClicked=false;
const stageHeart=document.getElementById('stage-heart');
const stageReveal=document.getElementById('stage-reveal');
const stageFinal=document.getElementById('stage-final');
const thumbRow=document.getElementById('thumbRow');
const questionBox=document.getElementById('questionBox');
const bigStage=document.getElementById('bigStage');

hc.addEventListener('click', async ()=>{
  if(heartClicked)return;
  heartClicked=true;heartAnimActive=false;
  stageHeart.classList.add('hidden');
  await playCrack();
  startReveal();
});

async function startReveal(){
  stageReveal.classList.add('active');
  // slotları yarat
  const slots=PHOTOS.map((_,i)=>{
    const slot=document.createElement('div');
    slot.className='photo-slot';
    const ph=document.createElement('div');
    ph.className='ph-placeholder';
    ph.innerHTML=`<div style="font-size:1.1rem">❤</div><div style="font-size:.6rem;letter-spacing:.5px;">Фото ${i+1}</div>`;
    slot.appendChild(ph);
    thumbRow.appendChild(slot);
    return slot;
  });

  for(let i=0;i<PHOTOS.length;i++){
    await showPhotoAt(i, slots[i]);
  }
  questionBox.classList.add('show');
}

function showPhotoAt(i, slot){
  return new Promise(resolve=>{
    const cw=Math.min(innerWidth*0.66,260), ch=Math.min(innerWidth*0.84,330);
    const card=document.createElement('div');
    card.className='big-card';
    card.style.left=(innerWidth/2-cw/2)+'px';
    card.style.top=(innerHeight/2-ch/2)+'px';
    card.style.width=cw+'px';card.style.height=ch+'px';
    fillWithPhoto(card, PHOTOS[i], i+1, false);
    bigStage.appendChild(card);
    requestAnimationFrame(()=>card.classList.add('show'));

    setTimeout(()=>{
      const r=slot.getBoundingClientRect();
      card.style.left=r.left+'px';card.style.top=r.top+'px';
      card.style.width=r.width+'px';card.style.height=r.height+'px';
      setTimeout(()=>{
        slot.classList.add('filled');
        fillWithPhoto(slot, PHOTOS[i], i+1, true);
        card.remove();
        resolve();
      }, SHRINK_MS);
    }, HOLD_MS);
  });
}

/* ============ Да / Нет ============ */
const btnYes=document.getElementById('btnYes'),btnNo=document.getElementById('btnNo');
btnNo.addEventListener('click',()=>{
  sendTelegram("❌ Yox dedi");
  document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake');
  btnNo.classList.add('gone');
});
btnYes.addEventListener('click',()=>{
  sendTelegram("✅ Hə dedi");
  stageReveal.classList.remove('active');
  stageFinal.classList.add('active');
  launchConfetti();
});
function launchConfetti(){
  for(let i=0;i<30;i++){
    setTimeout(()=>{
      const h=document.createElement('div');
      h.className='confetti-heart';h.textContent='❤';
      h.style.left=Math.random()*100+'vw';
      h.style.fontSize=(Math.random()*16+14)+'px';
      h.style.animationDuration=(Math.random()*2+2.5)+'s';
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),5000);
    },i*90);
  }
}
</script>
</body>
</html>
